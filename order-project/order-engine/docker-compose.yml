networks:
  order-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  # ---------------------------------------------------------------------
  # Altyapı (Infrastructure)
  # ---------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [order-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Exactly-once producer (transactional) için gerekli minimum ayarlar
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [order-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [order-net]

  # Distributed Tracing: OTLP/gRPC üzerinden gelen trace'leri toplayıp
  # UI'da (http://localhost:16686) görselleştirir. Servisler pkg/tracing
  # aracılığıyla buraya span gönderir (bkz. OTLP_ENDPOINT env değişkeni).
  jaeger:
    image: jaegertracing/all-in-one:1.53
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
    networks: [order-net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [order-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order_engine
      POSTGRES_PASSWORD: order_engine
      POSTGRES_DB: order_engine
      # Database-per-Service: her mikroservis kendi izole veritabanına sahip.
      POSTGRES_MULTIPLE_DATABASES: "orders,inventory,payments"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [order-net]

  # ---------------------------------------------------------------------
  # Uygulama servisleri (Application services)
  # ---------------------------------------------------------------------
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: "50051"
      KAFKA_BROKERS: "kafka:29092"
      POSTGRES_DSN: "postgres://order_engine:order_engine@postgres:5432/orders?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      INVENTORY_SERVICE_ADDR: "inventory-service:50052"
      PAYMENT_SERVICE_ADDR: "payment-service:50053"
      OTLP_ENDPOINT: "jaeger:4317"
    networks: [order-net]

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "50052:50052"
    environment:
      GRPC_PORT: "50052"
      KAFKA_BROKERS: "kafka:29092"
      POSTGRES_DSN: "postgres://order_engine:order_engine@postgres:5432/inventory?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      OTLP_ENDPOINT: "jaeger:4317"
    networks: [order-net]

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "50053:50053"
    environment:
      GRPC_PORT: "50053"
      KAFKA_BROKERS: "kafka:29092"
      POSTGRES_DSN: "postgres://order_engine:order_engine@postgres:5432/payments?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      OTLP_ENDPOINT: "jaeger:4317"
    networks: [order-net]

  notification-consumer:
    build:
      context: .
      dockerfile: services/notification-consumer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CONSUMER_GROUP: "notification-consumer-group"
      REDIS_ADDR: "redis:6379"
    networks: [order-net]